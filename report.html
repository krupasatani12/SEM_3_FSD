<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Hub - Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>
  <div id="navbar1"></div>

  <div class="container mt-5">
    <div class="container w-100 pt-5 d-flex align-items-center justify-content-center flex-column">
      <h1 class="text-warning my-4">Selling Report</h1>
    </div>

    <div class="table-responsive glass-container">
      <table class="table table-hover">
        <thead class="table-dark" id="shead">
          <tr>
            <th>Name</th>
            <th>Quantity</th>
            <th>Total Amount</th>
            <th>Profit</th>
            <th>Date Sold</th>

          </tr>
        </thead>
        <tbody id="sbody">
          <!-- Data loads here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
          document.getElementById("navbar1").innerHTML = data;
          loadProfile();
        })
        .catch(error => console.log("Error loading navbar:", error));
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/report.js"></script>

</body>

</html>
