<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Hub - Suppliers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>
    <div id="navbar1"></div>

    <div class="container w-100 pt-5 d-flex align-items-center justify-content-center flex-column" id="stock-main">
        <h1 class="text-warning my-4">Add Supplier</h1>
        <form class=" w-75 h-75" id="supplier">
            <div class="mb-3">
                <label for="sname" class="form-label">Name</label>
                <input type="text" class="form-control" id="sname" required minlength="2">
            </div>

            <div class="mb-3">
                <label for="semail" class="form-label">Email</label>
                <input type="email" class="form-control" id="semail" required>
            </div>
            <div class="mb-3">
                <label for="snum" class="form-label">Number</label>
                <input type="tel" class="form-control" id="snum" required minlength="10" maxlength="10">
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-primary">Add Supplier</button>
            </div>
        </form>
    </div>

    <div class="container w-100 pt-5 d-flex align-items-center justify-content-center flex-column">
        <h1 class="text-warning my-4">Suppliers List</h1>

    </div>

    <div class="container">
        <div class="table-responsive glass-container">
            <table class="table table-hover">
                <thead class="table-dark" id="shead">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                    </tr>
                </thead>
                <tbody id="sbody">
                    <!-- Data loads here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Message Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-top">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title text-black" id="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-dark" data-bs-dismiss="modal">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("navbar.html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("navbar1").innerHTML = data;

                    loadProfile();
                })
                .catch(error => console.log("Error loading navbar:", error));
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/sup.js"></script>
</body>

</html>
