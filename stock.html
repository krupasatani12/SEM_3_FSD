<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Hub - Stock Entry</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="./css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">


</head>

<body>
  <div id="navbar1"></div>
  <div class="container w-100 pt-5 d-flex align-items-center justify-content-center flex-column" id="stock-main">
    <h1 class="text-warning my-4">Stock-In</h1>

    <form class=" w-75 h-75" id="stockin">
      <div class="mb-3">
        <label for="name" class="form-label">Item Name</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="mb-3">
        <label for="category" class="form-label">Category</label>

        <select id="cat" class="form-select form-select-md mb-3 " required>
          <option value="" selected disabled>Open this category</option>
          <option value="Groceries" style="background-color: #333333;">Groceries</option>
          <option value="Coldrinks" style="background-color: #333333;">Coldrinks</option>
          <option value="Namkeen" style="background-color: #333333;">Namkeen</option>

        </select>
      </div>

      <div class="mb-3">
        <label for="qty" class="form-label">Quantity</label>
        <input type="number" class="form-control" id="qty" min="1" required>
      </div>

      <div class="mb-3">
        <label for="exp" class="form-label">Expiry-Date</label>
        <input type="date" class="form-control" id="exp" required>
      </div>

      <div class="mb-3">
        <label for="buy" class="form-label">Buying Price</label>
        <input type="number" class="form-control" id="buy" step="0.01" min="0.01" required>

      </div>
      <div class="mb-3">
        <label for="sell" class="form-label">Selling Price</label>
        <input type="number" class="form-control" id="sell" step="0.01" min="0.01" required>

      </div>

      <button type="submit" class="btn">Add to Inventory</button>
    </form>

  </div>

  <!-- Message Modal -->
  <div class="modal fade" id="messageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-top">
      <div class="modal-content">
        <div class="modal-header bg-warning">
          <h5 class="modal-title text-black" id="modalTitle">Message</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody">
          ...
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-dark" data-bs-dismiss="modal">
            Close
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
          document.getElementById("navbar1").innerHTML = data;
        })
        .catch(error => console.log("Error loading navbar:", error));
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/stock.js"></script>

</body>

</html>
