<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Inventory Hub - Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/lr.css">
</head>

<body class="d-flex justify-content-center align-items-center">

    <div class="lr_card">

        <div class="text-center mb-5">
            <i class="bi bi-box-fill fs-1 me-3 text-warning"></i>
            <span class="fw-bold mb-4 fs-1">Inventory <span class="text-warning fs-1">Hub</span></span>
        </div>

        <form id="reg">
            <div class="mb-4">
                <label class="form-label">UserName</label>
                <input type="text" class="form-control plh" placeholder="Enter your User name" required id="uname"
                    minlength="4">
            </div>

            <div class="mb-4">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control plh" placeholder="Enter your email" required id="uemail">
            </div>

            <div class="mb-4">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control plh" placeholder="Enter your mobile number" required id="umobile"
                    minlength="10" maxlength="10">
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control plh" placeholder="Create password" required id="upass"
                    minlength="6">
            </div>

            <button type="submit" class="btn btn-primary text-black fw-bold mt-4"
                style="background-color: #FFD700; width: 100%; border: none">Register</button>

            <div class="text-center mt-3">
                <small>Already have an account? <a href="login.html"
                        style="color: #FFD700; text-decoration: none;">Login here</a></small>
            </div>
        </form>

    </div>

    <!-- Message Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-top">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title text-black" id="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-dark" data-bs-dismiss="modal">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>



    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Js link for registration -->
    <script src="./js/register.js"></script>

</body>

</html>
