<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Hub - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="./css/lr.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">


</head>

<body class="d-flex justify-content-center align-items-center">

    <div class="lr_card ">
        <div class="text-center mb-5">
            <i class="bi bi-box-fill fs-1 me-3 text-warning"></i>
            <span class="fw-bold mb-4 fs-1">Inventory <span class="text-warning fs-2">Hub</span></span>
        </div>

        <form id="login1">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control plh" placeholder="name@example.com" required id="l_email">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control plh" placeholder="********" required id="l_pass">
            </div>
            <div class="mt-4 mb-3">
                <button type="submit" class="btn btn-primary text-black fw-bold"
                    style="background-color: #FFD700; width: 100%; border: none">Login</button>
            </div>
        </form>

        <div class="text-center">
            <p class="small">Don't have an account?
                <a href="register.html" style="color: #FFD700; text-decoration: none;">Register</a>
            </p>
        </div>
    </div>

    <!-- Message Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-top">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title text-black" id="modalTitle">Message</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    ...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-dark" data-bs-dismiss="modal">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./js/login.js"></script>
</body>

</html>
