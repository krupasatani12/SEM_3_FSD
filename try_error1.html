<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
     <h2>Registration Form</h2>

    <form>

        <!-- Text -->
        <label class="form-label">Full Name:</label>
        <input type="text" class="form-control" placeholder="Enter full name"><br><br>

        <!-- Email -->
        <label class="form-label">Email:</label>
        <input type="email" class="form-control" placeholder="example@mail.com"><br><br>

        <!-- Password -->
        <label class="form-label">Password:</label>
        <input type="password" class="form-control" placeholder="Enter password"><br><br>

        <!-- Number -->
        <label class="form-label">Age:</label>
        <input type="number" class="form-control form-control-lg" min="1" max="100"><br><br>

        <!-- Tel -->
        <label class="form-label">Phone Number:</label>
        <input type="tel" class="form-control" placeholder="+91 98765 43210"><br><br>

        <!-- URL -->
         <div class="input-group">
        <label class="input-group-text">Website (optional):</label>
        <input type="url" class="form-control" placeholder="https://example.com">
        
        </div><br><br>

        <!-- Date -->
             <label class="form-label">Date of Birth:</label>
            <input type="date" class="form-control" placehoder="DOB">
           
      

        <!-- Time -->
        <label  class="form-label">Preferred Contact Time:</label>
        <input type="time" class="form-control"><br><br>

        <!-- Color -->
        <label class="form-label">Favorite Color:</label>
        <input type="color" class="form-control-color"><br><br>

        <!-- Range -->
        <label class="form-label">Satisfaction Level (0–10):</label>
        <input class="form-range" type="range" min="0" max="10"><br><br>

        <!-- File -->
        <label class="form-label">Upload Profile Picture:</label>
        <input type="file" class="form-control-file"><br><br>

        <!-- Radio -->
        <label>Gender:</label>
        <div class="form-check">
            <input type="radio" name="gender" value="male" class="form-check-input"> 
            <label class="form-check-label">Male</label>
        </div>
        <div class="form-check">
            <input type="radio" name="gender" value="female" class="form-check-input"> 
            <label class="form-check-label">Female</label>
        </div>

        <!-- Checkbox -->
        <label>Skills:</label>
        <input type="checkbox"> HTML
        <input type="checkbox"> CSS
        <input type="checkbox"> JavaScript

        <!-- Select -->
        <label>Country:</label>
        <select class="form-select form-select-lg">
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Australia</option>
        </select>
        <br><br>

        <!-- Textarea -->
        <label>Address:</label>
        <textarea rows="3" cols="30" placeholder="Enter address"></textarea><br><br>

        <!-- Submit -->
        <button type="submit">Register</button>

    </form>
</div>
</body>
</html>
