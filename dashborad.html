<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Hub - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>
    <!--  navbar link -->
    <div id="navbar1"></div>
    <div class="container-fluid mt-5 p-4">
        <div class="container d-flex align-items-center justify-content-center flex-column">
            <h1 class="text-warning mb-4">Dashboard - Inventory</h1>
        </div>
        <div id="alertSection" class="row mb-5 alert-card"></div>
        <div class="container d-flex align-items-center justify-content-center flex-column">
        </div>
        <div class="table-responsive glass-container">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Stock</th>
                        <th>Expiry</th>
                        <th>Selling Price</th>
                        <th>Buying Price</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody"></tbody>
            </table>
        </div>
    </div>


    <!-- js link for navbar -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("navbar.html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("navbar1").innerHTML = data;

                })
                .catch(error => console.log("Error loading navbar:", error));
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Js link for registration -->
    <script src="./js/dash.js"></script>


</body>

</html>
