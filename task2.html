<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function fun1(){
            document.getElementById("p1").style.textTransform="uppercase"
        }
        function fun2(){
            document.getElementById("p1").style.textTransform="lowercase"
        }

    </script>
</head>
<body>
    <p id="p1">Hello</p>
    <button type="button" onclick="fun1()">UPPER</button>
    <button type="button" onclick="fun2()">lower</button>

</body>
</html>
