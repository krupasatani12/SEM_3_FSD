<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container mt-3 bg-light">
        <form>
            <!--vertically-->
            <label for="fn"class="form-label">First Name:
                <input type="text"id="fn"class="form-control form-control-lg">
            </label>
            <br>
            <label for="ln"class="form-label">Last Name:
                <input type="text"id="ln"placeholder="Enter your lastname"class="form-control-plaintext">
            </label>
            <!--horizontally-->
            <div class="row mt-3">
                <div class="col-2">
                    <label for="un"class="form-label">Username:
                    </label>
                </div>
                <div class="col-12">
                    <input type="text"id="un"class="form-control">
                </div>
            </div>
            <!--Layout-->
            <div class="row mt-3">
                <div class="col-2 text-end">
                    <label for="pw"class="form-label ">password:
                    </label>
                </div>
                <div class="col-4">
                    <input type="password"id="pw"class="form-control"disabled>
                </div>
                <div class="col-2">
                    <label for="un"class="form-label">Confirm password:
                    </label>
                </div>
                <div class="col-4">
                    <input type="text"id="un"class="form-control">
                </div>
            </div>
            <label class="form-label">Hobbies:</label>
            <div class="form-check">
                <input type="checkbox"class="form-check-input">
                <label class="form-check-label">Swimming</label>
            </div>
            <div class="form-check">
                <input type="checkbox"class="form-check-input">
                <label class="form-check-label">Dancing</label>
            </div>
            <div class="form-check">
                <input type="checkbox"class="form-check-input">
                <label class="form-check-label">Travelling</label>
            </div>
            <label class="form-label">Gender:</label>
            <div class="form-check-inline">
                <input type="radio"name="rn"class="form-check-input"checked>
                <label class="form-check-label">Female</label>
            </div>
            <div class="form-check-inline">
                <input type="radio"name="rn"class="form-check-input">
                <label class="form-check-label">Male</label>
            </div>
            <div class="form-check form-switch">
                <input type="checkbox"id="ag"class="form-check-input">
                <label class="form-check-label"for="ag">Agree to terms</label>
            </div>
            <label class="form-label">City:</label>
            <select class="form-select form-select-sm">
                <option hidden selected disabled>--select city--</option>
                <option>Ahemdabad</option>
                <option>Surat</option>
                <option>Rajkot</option>
            </select>
            <label class="form-label">Price Range:</label>
            <div class="row">
                <div class="col">100</div>
                <div class="col text">200</div>
                <div class="col text-center">300</div>
                <div class="col text-end">400</div>
                <div class="col text-end">500</div>
            </div>
            <input type="range"class="form-range"min="100"max="500"step="100">
            <label class="form-label">Fav-Color</label>
            <input type="color"class="form-control-color"value="#56ff78">
            <label class="form-label">Upload photo:</label>
            <input type="file"class="form-control-file">
            <br>
            <label class="form-label">Comments:</label>
            <textarea class="form-control"placeholder="enter comments.."rows="7"></textarea>
            <label class="form-label">Email:</label>
            <div class="input-group">
                <input type="text"class="form-control">
                <span class="input-group-text">@gmail.com</span>
            </div>
        </form>
    </div>

</body>
</html>
