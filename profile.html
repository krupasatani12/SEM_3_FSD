<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Hub - Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <div id="navbar1"></div>
    <div class="container d-flex justify-content-evenly flex-column w-100 mt-5" id="profile">
        <h2 class="offcanvas-title text-warning py-4">
            <i class="bi bi-person-circle"></i> My Profile
        </h2>
        <div class="mb-3">
            <label class="form-label fw-bold">Name</label>
            <p id="profileName" class="form-control bg-dark text-light">Loading...</p>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Mobile</label>
            <p id="profileMobile" class="form-control bg-dark text-light">Loading...</p>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Email</label>
            <p id="profileEmail" class="form-control bg-dark text-light">Loading...</p>
        </div>
        <button id="logoutBtn" class="btn container w-50 fs-5" onclick="handleLogout()">
            <i class="bi bi-box-arrow-left text-warning text-black"></i><span> Logout</span>
        </button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("navbar.html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("navbar1").innerHTML = data;
                    loadProfile();
                })
                .catch(error => console.log("Error loading navbar:", error));
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/profile.js"></script>

</body>

</html>
